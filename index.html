<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030711">
<meta name="description" content="SURI Tools Center: todas las herramientas de trabajo en un solo lugar.">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:title" content="SURI Tools Center">
<meta property="og:description" content="Turnero, asistencia, encuestas y certificados en un solo panel de trabajo.">
<meta name="twitter:card" content="summary">
<title>SURI Tools Center</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='14' width='48' height='40' rx='15' fill='%23001E50'/%3E%3Cpath d='M32 14V9' stroke='%2300A8F0' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='7' r='4.2' fill='%2300A8F0'/%3E%3Ccircle cx='23.500' cy='32' r='8.500' fill='%23fff'/%3E%3Ccircle cx='40.500' cy='32' r='8.500' fill='%23fff'/%3E%3Ccircle cx='24.500' cy='33' r='4.200' fill='%230A1A2F'/%3E%3Ccircle cx='41.500' cy='33' r='4.200' fill='%230A1A2F'/%3E%3Cpath d='M26 46q6 5 12 0' fill='none' stroke='%2300A8F0' stroke-width='2.600' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500..800&family=Rajdhani:wght@500..700&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5;--surface:#FFFFFF;--surface-2:#F5F7FA;--ink:#0A1A2F;--ink-2:#44546B;--ink-3:#7686A0;
  --line:#DCE3EC;--line-2:#C6D0DD;--brand:#001E50;--sky:#009FE3;--ok:#16A36A;--bad:#D6453D;
  --rail:260px;--ring:#009FE3;
  --display:"Orbitron","Bricolage Grotesque","Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --text:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#030711;--deep:#061326;--surface:#0A1930;--surface-2:#102441;--ink:#F4F8FF;--ink-2:#91A7C4;--ink-3:#6C83A3;
  --line:#16315A;--line-2:#1F4A86;--brand:#24E5FF;--sky:#168CFF;--electric:#0866FF;--cyan:#24E5FF;--ok:#2DD18E;--bad:#FF6F66;--ring:#24E5FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:var(--text);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:8px}
.skip{position:fixed;left:12px;top:-60px;z-index:200;padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;transition:top .15s}
.skip:focus{top:12px}
.canvas:focus{outline:none}
.stagetitle h2:focus{outline:none}
kbd{font:600 11px/1 var(--text);padding:4px 6px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;color:var(--ink-2);background:var(--surface-2)}

/* ---------- Estructura ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);height:100dvh;transition:grid-template-columns .25s ease}
.app.mini{--rail:78px}
.workspace{display:flex;flex-direction:column;min-width:0;min-height:0}

/* ---------- Barra lateral ---------- */
.rail{display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px 14px;min-height:0;z-index:30;overflow:hidden}
.brand{display:flex;align-items:center;gap:12px;padding:2px 6px 22px;min-height:60px}
.brand .mascot-slot{width:44px;height:48px;flex:none}
.mascot-slot.big{width:84px;height:92px;margin:0 auto 14px}
.mascot{display:block;width:100%;height:100%;overflow:visible}
.m-eye{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
.m-eye+.m-eye{animation-delay:.04s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.m-hop{transform-box:fill-box;transform-origin:50% 100%}
.mascot.hop .m-hop{animation:hop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:none}30%{transform:translateY(-7px) scale(.95,1.07)}62%{transform:translateY(0) scale(1.07,.93)}100%{transform:none}}
.m-ant{transform-box:fill-box;transform-origin:50% 100%}
.mascot.hop .m-ant{animation:wob .55s ease-out}
@keyframes wob{0%,100%{transform:none}35%{transform:rotate(14deg)}70%{transform:rotate(-9deg)}}
.hk{margin-left:8px}
.meta{display:flex;align-items:center;gap:0}
@media(hover:none){.hk{display:none}}
.brand b{display:block;font:700 19px/1 var(--display);letter-spacing:.02em}
.brand small{display:block;color:var(--ink-3);font-size:12px;margin-top:4px}
.railnav{display:grid;gap:4px;align-content:start;flex:1;overflow:auto;padding:2px}
.rl{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--ink-2);font-weight:550;font-size:14px;position:relative;transition:background .15s,color .15s}
.rl:hover{background:var(--surface-2);color:var(--ink)}
.rl[aria-current="page"]{color:var(--ink);background:color-mix(in srgb,var(--t,var(--sky)) 12%,transparent)}
.rl[aria-current="page"] svg.i{color:var(--t,var(--sky))}
.rl[aria-current="page"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--t,var(--sky))}
.rl .lbl{flex:1;white-space:nowrap}
.rl .tagweb{font-size:11px;font-weight:650;color:var(--sky);background:color-mix(in srgb,var(--sky) 14%,transparent);padding:3px 7px;border-radius:999px}
.railsep{height:1px;background:var(--line);margin:10px 6px}
.railfoot{display:grid;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.status{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent);flex:none}
.status.off .dot{background:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 20%,transparent)}
.collapse{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:transparent;border-radius:12px;color:var(--ink-3);font-size:13px;font-weight:550}
.collapse:hover{background:var(--surface-2);color:var(--ink)}
.app.mini .lbl,.app.mini .brand div,.app.mini .status span:last-child,.app.mini .collapse span,.app.mini .tagweb{display:none}
.app.mini .rl,.app.mini .collapse,.app.mini .status{justify-content:center;padding-inline:0}
.app.mini .brand{justify-content:center;padding-inline:0}
.app.mini .collapse svg{transform:scaleX(-1)}

/* ---------- Barra superior ---------- */
.topbar{display:flex;align-items:center;gap:12px;height:68px;flex:none;padding:0 28px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);position:relative;z-index:20}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);transition:border-color .15s,color .15s}
.iconbtn:hover{border-color:var(--line-2);color:var(--ink)}
.menubtn{display:none}
.crumbs{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;color:var(--ink-3);font-weight:550}
.crumbs a:hover{color:var(--ink)}
.crumbs svg.i{width:14px;height:14px}
.crumbs .cur{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.palbtn{display:flex;align-items:center;gap:10px;height:40px;padding:0 8px 0 14px;min-width:min(340px,38vw);border:1px solid var(--line);background:var(--surface);border-radius:12px;color:var(--ink-3);font-size:14px;transition:border-color .15s}
.palbtn:hover{border-color:var(--line-2)}
.palbtn span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.themebtn .sun{display:none}
html[data-theme="dark"] .themebtn .sun{display:block}
html[data-theme="dark"] .themebtn .moon{display:none}

/* ---------- Contenido ---------- */
.canvas{flex:1;min-height:0;position:relative}
.home{height:100%;overflow:auto;padding:0 28px 40px;scroll-behavior:smooth}
.homein{max-width:1240px;margin:0 auto}
.hero{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:32px;padding:46px 0 34px;flex-wrap:wrap}
.hero::before{content:"";position:absolute;inset:0 -28px 0 -28px;background-image:radial-gradient(color-mix(in srgb,var(--ink) 16%,transparent) 1px,transparent 1.4px);background-size:22px 22px;mask-image:linear-gradient(180deg,#000,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);opacity:.5;pointer-events:none}
.hero>*{position:relative}
.hello h1{margin:0;font:700 clamp(40px,6.2vw,76px)/.98 var(--display);letter-spacing:-.035em;max-width:11ch}
.hello p{margin:16px 0 0;font-size:17px;color:var(--ink-2);max-width:44ch}
.clock{text-align:right;margin-left:auto}
.clock .time{font:600 clamp(46px,7vw,96px)/.9 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;justify-content:flex-end;gap:6px}
.clock .sec{font-size:.36em;color:var(--ink-3);letter-spacing:-.01em;width:1.6em;text-align:left}
.clock .date{margin-top:10px;color:var(--ink-2);font-size:16px;font-weight:550}

.recents{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 22px}
.recents h2{margin:0 6px 0 0;font:650 14px/1 var(--text);color:var(--ink-3)}
.rchip{display:inline-flex;align-items:center;gap:10px;padding:7px 14px 7px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px;font-weight:550;transition:border-color .15s}
.rchip:hover{border-color:color-mix(in srgb,var(--t) 60%,var(--line))}
.rchip .ri{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--t) 16%,transparent);color:var(--t)}
.rchip .ri svg.i{width:15px;height:15px}
.rchip small{color:var(--ink-3);font-weight:450}

.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{--t:var(--sky);display:flex;flex-direction:column;grid-column:span 6;min-height:260px;padding:22px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,color-mix(in srgb,var(--t) 8%,var(--surface)),var(--surface) 58%);position:relative;overflow:hidden;transition:border-color .2s,transform .2s}
.card:hover{border-color:color-mix(in srgb,var(--t) 55%,var(--line));transform:translateY(-2px)}
.card.c-lg{grid-column:span 7;grid-row:span 2;border-radius:30px;padding:28px}
.card.c-md{grid-column:span 5}
.card.c-wide{grid-column:span 6}
.card.c-full{grid-column:span 12;min-height:0}
.c-full .art svg{max-width:200px}
.art{flex:1;display:grid;place-items:center;min-height:110px;padding:6px 0 14px}
.art svg{width:100%;max-width:290px;height:auto;color:var(--t)}
.c-lg .art svg{max-width:440px}
.cbody h3{margin:0;font:650 22px/1.15 var(--display);letter-spacing:-.015em}
.c-lg .cbody h3{font-size:32px;letter-spacing:-.025em}
.cbody p{margin:8px 0 0;color:var(--ink-2);font-size:14.5px;max-width:46ch}
.cfoot{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.chip{font-size:12px;font-weight:650;color:var(--ink-2);padding:5px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.open{display:inline-flex;align-items:center;gap:8px;font-weight:650;font-size:14px;color:var(--t)}
.open svg.i{width:18px;height:18px;transition:transform .2s}
.card:hover .open svg.i{transform:translateX(4px)}
.card.dark{--t:#4FC3FF;background:radial-gradient(120% 90% at 85% 0%,#0B3C86 0%,transparent 60%),#001E50;border-color:#0F3A7A;color:#fff}
.card.dark .cbody p{color:#B7CDEB}
.card.dark .chip{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#D6E6FA}
.card.dark:hover{border-color:#4FC3FF}
.card.dark .a-frame{fill:rgba(255,255,255,.05);stroke:rgba(255,255,255,.2)}

/* ilustraciones */
.a-frame{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1.5}
.a-line{stroke:var(--line-2);stroke-width:1.5;fill:none}
.a-fill{fill:color-mix(in srgb,var(--t) 24%,transparent)}
.a-solid{fill:var(--t)}
.a-arc{stroke:var(--t);fill:none;stroke-width:9;stroke-linecap:round}
.a-hand{stroke:var(--t);fill:none;stroke-width:5;stroke-linecap:round}
.a-white{stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}

.foot{margin-top:34px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--ink-3);font-size:13px}

/* ---------- Visor de herramienta ---------- */
.stage{height:100%;display:flex;flex-direction:column;padding:16px 28px 22px;gap:14px}
.stagebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink-2);transition:border-color .15s,color .15s,background .15s}
.btn:hover{border-color:var(--line-2);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9;color:var(--bg)}
.stagetitle{display:flex;align-items:center;gap:12px;min-width:0;margin-left:4px}
.stagetitle .ti{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:color-mix(in srgb,var(--t) 15%,transparent);color:var(--t);flex:none}
.stagetitle h2{margin:0;font:650 19px/1.1 var(--display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stagetitle p{margin:3px 0 0;font-size:13px;color:var(--ink-3)}
.frame{flex:1;min-height:0;position:relative;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface)}
.pane{position:absolute;inset:0;display:none;background:#fff}
.pane.active{display:block}
.pane iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.pbar{display:none;position:absolute;left:0;right:0;top:0;height:3px;background:color-mix(in srgb,var(--t) 18%,transparent);overflow:hidden;z-index:3}
.pbar::after{content:"";position:absolute;inset:0 auto 0 0;width:38%;background:var(--t);border-radius:3px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(360%)}}
.pane.loading .pbar{display:block}
.loader{display:none;position:absolute;inset:0;z-index:2;background:var(--surface);place-items:center;text-align:center;padding:24px}
.pane.loading .loader{display:grid}
.loader>div{max-width:380px}
.skel{display:grid;gap:10px;margin:0 auto 22px;width:min(280px,70vw)}
.skel i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.skel i:nth-child(1){width:100%}.skel i:nth-child(2){width:78%}.skel i:nth-child(3){width:52%}
@keyframes shimmer{to{background-position:-200% 0}}
.loader strong{display:block;font:650 18px/1.2 var(--display);color:var(--ink)}
.loader span{display:none;margin-top:8px;color:var(--ink-2);font-size:14px}
.pane.slow .loader span{display:block}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:28px;background:var(--surface)}
.empty .eico{display:grid;place-items:center;width:64px;height:64px;border-radius:20px;margin:0 auto 18px;background:color-mix(in srgb,var(--t) 16%,transparent);color:var(--t)}
.empty .eico svg.i{width:30px;height:30px}
.empty h3{margin:0 0 8px;font:650 24px/1.15 var(--display);color:var(--ink)}
.empty p{margin:0 auto;max-width:46ch;color:var(--ink-2)}
.empty .btn span{display:inline}
.empty code{font:600 13px var(--text);background:var(--surface-2);border:1px solid var(--line);padding:2px 7px;border-radius:6px;color:var(--ink)}

/* modo pantalla completa del panel */
.app.focus{grid-template-columns:minmax(0,1fr)}
.app.focus .rail,.app.focus .topbar{display:none}
.app.focus .stage{padding:12px}

/* ---------- Buscador ---------- */
dialog.pal{border:1px solid var(--line-2);border-radius:20px;padding:0;width:min(620px,calc(100vw - 28px));background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,10,30,.45);margin:12vh auto auto}
dialog.pal::backdrop{background:rgba(3,10,22,.55);backdrop-filter:blur(4px)}
.palhead{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);color:var(--ink-3)}
.palhead input{flex:1;border:0;outline:0;background:transparent;font-size:17px;color:var(--ink)}
.pallist{list-style:none;margin:0;padding:8px;max-height:min(52vh,420px);overflow:auto}
.pli{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:12px;cursor:pointer}
.pli.sel{background:var(--surface-2)}
.pli .pi{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:color-mix(in srgb,var(--t,var(--sky)) 15%,transparent);color:var(--t,var(--sky))}
.pli b{display:block;font-weight:600;font-size:15px}
.pli small{display:block;color:var(--ink-3);font-size:13px}
.pli .ent{margin-left:auto;opacity:0}
.pli.sel .ent{opacity:1}
.palnone{padding:26px;text-align:center;color:var(--ink-3)}
.palfoot{display:flex;gap:18px;padding:11px 18px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12.5px}
.palfoot span{display:inline-flex;align-items:center;gap:6px}

/* aviso */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:550;z-index:100;max-width:calc(100vw - 32px);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* entrada (solo al cargar) */
.intro .hello,.intro .heat,.intro .clock,.intro .card,.intro .recents{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.scrim{display:none}

/* ══ Heat word ═════════════════════════════════════════════ */
.heat {
  position: relative;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  /* en el panel el lienzo se adapta al ancho disponible */
  width: min(380px, 100%);
  aspect-ratio: 380 / 150;
  flex: none;}

.heat-canvas { display: block; width: 100%; height: 100%; }

/* ---------- Adaptación ---------- */
@media(max-width:1100px){
  .card.c-lg{grid-column:span 12;grid-row:span 1}
  .card.c-md,.card.c-wide{grid-column:span 6}
  .card.c-full{grid-column:span 12}
  .hello h1{max-width:none}
}
@media(max-width:860px){
  .app,.app.mini{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:0 auto 0 0;width:286px;max-width:86vw;transform:translateX(-105%);transition:transform .25s ease;box-shadow:0 0 60px rgba(0,0,0,.35)}
  .app.mini .lbl,.app.mini .brand div,.app.mini .status span:last-child,.app.mini .tagweb{display:revert}
  .app.mini .rl,.app.mini .status{justify-content:flex-start;padding-inline:12px}
  .app.mini .brand{justify-content:flex-start;padding-inline:6px}
  .collapse{display:none}
  .app.menuopen .rail{transform:none}
  .app.menuopen .scrim{display:block;position:fixed;inset:0;background:rgba(3,10,22,.55);z-index:25}
  .menubtn{display:inline-grid}
  .topbar{padding:0 14px;height:62px}
  .palbtn{min-width:0;flex:1}
  .palbtn kbd{display:none}
  .crumbs{display:none}
  .home{padding:0 16px 32px}
  .hero{padding:28px 0 24px;align-items:flex-start}
  .clock{text-align:left;width:100%}

<script>
/* ============================================================
   ✏️ PEGÁ ACÁ LA URL DE TU IA (entre las comillas).
   Ejemplo: const AI_URL = "https://mi-ia.com";
   Tiene que empezar con https:// para que funcione en GitHub Pages.

/* ✏️ PEGÁ ACÁ LA URL DE SURI (IA principal), entre las comillas. Debe empezar con https://
   Si queda vacía ("") SURI no aparece en el centro. */
const AI_URL = "";

const AI_EMBED = true;

/* ---------- Herramientas ---------- */
const ALL_TOOLS = [
  {id:'turnero', name:'Generador de Turnero', short:'Turnero', desc:'Generá los turnos del taller y exportalos a Excel desde el panel principal.', src:'herramientas/turnero.html', kind:'local', color:'#2F6BFF', icon:'i-grid', size:'c-lg', keys:'turnos taller excel'},
  {id:'asistencia', name:'Control de Asistencia', short:'Asistencia', desc:'Proyecto de control de asistencia de Organización Sur.', src:'herramientas/control-asistencia.html', kind:'local', color:'#0E9F8E', icon:'i-clock', size:'c-md', keys:'presentismo horarios ingreso egreso'},
  {id:'encuestas', name:'Gestor de Encuestas', short:'Encuestas', desc:'Prepará y trabajá tus encuestas internas a partir de planillas de Excel.', src:'herramientas/gestor-encuestas.html', kind:'local', color:'#E08A00', icon:'i-chart', size:'c-md', keys:'encuesta interna pasos taller'},
  {id:'certificados', name:'Gestor de Certificados', short:'Certificados', desc:'Sistema web para gestionar los certificados de los trabajadores.', src:'https://gestor-certificados-06pf.onrender.com/', kind:'web', embed:false, launch:'El Gestor de Certificados tiene su propio sitio seguro y no permite mostrarse dentro de otro panel. Se abre en una pestaña nueva, y cuando termines volvés acá.', color:'#7B4DE8', icon:'i-badge', size:'c-wide', keys:'certificado sucursal trabajadores', slow:'Este sistema está alojado en internet y puede tardar hasta un minuto en despertar la primera vez.'},
  {id:'ia', name:'SURI · IA principal', short:'SURI', desc:'Tu asistente de inteligencia artificial, siempre a mano dentro del espacio de trabajo.', src:AI_URL, kind:'web', embed:AI_EMBED, launch:'Tu IA se abre en su propia pestaña porque el sitio no permite mostrarse dentro de otro panel.', color:'#00A8F0', icon:'i-spark', size:'c-full dark', keys:'inteligencia artificial asistente chat', slow:'Algunos sitios tardan en abrir. Si no aparece nada, usá Abrir aparte.'}
];
/* Mi IA no aparece hasta que pegues su URL en AI_URL: así nadie ve una
   herramienta vacía ni instrucciones de configuración. */
const TOOLS = ALL_TOOLS.filter(t => t.src);

const ART = {
  turnero:`<svg viewBox="0 0 240 150" aria-hidden="true"><rect class="a-frame" x="6" y="6" width="228" height="138" rx="16"/><path class="a-line" d="M6 38H234M62 38V144M118 38V144M174 38V144"/><circle class="a-solid" cx="24" cy="22" r="4.5"/><rect class="a-fill" x="36" y="19" width="52" height="6" rx="3"/><rect class="a-solid" x="14" y="46" width="40" height="32" rx="8"/><rect class="a-fill" x="70" y="62" width="40" height="46" rx="8"/><rect class="a-fill" x="126" y="46" width="40" height="26" rx="8"/><rect class="a-solid" x="182" y="80" width="44" height="42" rx="8"/><rect class="a-fill" x="14" y="92" width="40" height="40" rx="8"/><rect class="a-fill" x="126" y="82" width="40" height="46" rx="8"/><rect class="a-fill" x="182" y="46" width="44" height="26" rx="8"/></svg>`,
  asistencia:`<svg viewBox="0 0 240 150" aria-hidden="true"><circle class="a-frame" cx="120" cy="75" r="56"/><path class="a-arc" d="M120 19A56 56 0 1 1 64.6 84"/><path class="a-hand" d="M120 75V46M120 75l22 13"/><circle class="a-solid" cx="120" cy="75" r="6"/><rect class="a-fill" x="12" y="40" width="30" height="8" rx="4"/><rect class="a-fill" x="12" y="58" width="22" height="8" rx="4"/><rect class="a-fill" x="198" y="84" width="30" height="8" rx="4"/><rect class="a-fill" x="206" y="102" width="22" height="8" rx="4"/></svg>`,
  encuestas:`<svg viewBox="0 0 240 150" aria-hidden="true"><rect class="a-frame" x="6" y="6" width="228" height="138" rx="16"/><rect class="a-solid" x="22" y="24" width="20" height="20" rx="6"/><path class="a-white" d="M27 34l4 4 7-8"/><rect class="a-fill" x="54" y="29" width="164" height="10" rx="5"/><rect class="a-solid" x="54" y="29" width="118" height="10" rx="5"/><rect class="a-solid" x="22" y="64" width="20" height="20" rx="6"/><path class="a-white" d="M27 74l4 4 7-8"/><rect class="a-fill" x="54" y="69" width="164" height="10" rx="5"/><rect class="a-solid" x="54" y="69" width="84" height="10" rx="5"/><rect class="a-frame" x="22" y="104" width="20" height="20" rx="6"/><rect class="a-fill" x="54" y="109" width="164" height="10" rx="5"/><rect class="a-solid" x="54" y="109" width="40" height="10" rx="5"/></svg>`,
  certificados:`<svg viewBox="0 0 240 150" aria-hidden="true"><rect class="a-frame" x="44" y="8" width="152" height="122" rx="14"/><rect class="a-solid" x="62" y="26" width="52" height="8" rx="4"/><rect class="a-fill" x="62" y="46" width="116" height="7" rx="3.5"/><rect class="a-fill" x="62" y="62" width="96" height="7" rx="3.5"/><rect class="a-fill" x="62" y="78" width="62" height="7" rx="3.5"/><path class="a-solid" d="M149 112l-8 30 17-9 17 9-8-30z"/><circle class="a-solid" cx="158" cy="104" r="21"/><path class="a-white" d="M148 104l7 7 12-14"/></svg>`,
  ia:`<svg viewBox="0 0 240 150" aria-hidden="true"><circle class="a-frame" cx="120" cy="75" r="62"/><circle class="a-frame" cx="120" cy="75" r="38"/><path class="a-solid" d="M120 33c3.4 24 16 36.6 40 40-24 3.4-36.6 16-40 40-3.4-24-16-36.6-40-40 24-3.4 36.6-16 40-40z"/><path class="a-solid" d="M192 26c1 8 5 12 13 13-8 1-12 5-13 13-1-8-5-12-13-13 8-1 12-5 13-13z"/><circle class="a-solid" cx="46" cy="112" r="5"/><circle class="a-fill" cx="204" cy="112" r="8"/></svg>`
};

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const tz = 'America/Argentina/Buenos_Aires';
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const ico = (id,cls='i') => `<svg class="${cls}"><use href="#${id}"/></svg>`;
const app = $('#app');
let current = null;
const panes = {};

function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),3600);
}

/* ---------- Tema ---------- */
function setTheme(mode){
  document.documentElement.dataset.theme = mode;
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.content = mode==='dark' ? '#030711' : '#EEF1F5';
  store.set('volksia_theme',mode);
}
function toggleTheme(){ setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'); }
setTheme('dark');
$('#themebtn').addEventListener('click',toggleTheme);

/* ---------- Menú lateral ---------- */
function buildNav(){
  const nav=$('#railnav');
  nav.innerHTML =
    `<a class="rl" href="#inicio" data-id="inicio" title="Inicio">${ico('i-home')}<span class="lbl">Inicio</span></a><div class="railsep"></div>` +
    TOOLS.map(t=>`<a class="rl" href="#${t.id}" data-id="${t.id}" style="--t:${t.color}" title="${t.name}">${ico(t.icon)}<span class="lbl">${t.name}</span>${t.kind==='web'&&t.id==='certificados'?'<span class="tagweb">Web</span>':''}</a>`).join('');
}
function setMenu(open){app.classList.toggle('menuopen',open)}
$('#menubtn').addEventListener('click',()=>setMenu(true));
$('#scrim').addEventListener('click',()=>setMenu(false));
$('#collapse').addEventListener('click',()=>{app.classList.toggle('mini');store.set('volksia_mini',app.classList.contains('mini'))});
if(store.get('volksia_mini',false)) app.classList.add('mini');

/* ---------- Estado de conexión ---------- */
function updateOnline(){
  const on=navigator.onLine,s=$('#status');
  s.classList.toggle('off',!on);
  s.querySelector('span:last-child').textContent = on?'En línea':'Sin conexión';
  s.setAttribute('role','status');
}
addEventListener('online',updateOnline);addEventListener('offline',updateOnline);updateOnline();

/* ---------- Reloj y saludo ---------- */
function tick(){
  const now=new Date();
  const [h,m,s]=now.toLocaleTimeString('es-AR',{hour12:false,timeZone:tz}).split(':');
  $('#clockHM').textContent=`${h.padStart(2,'0')}:${m}`;
  $('#clockS').textContent=s;
  const d=now.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',timeZone:tz}).replace(',','');
  $('#clockDate').textContent=d;
  const hr=parseInt(h,10);
  const g = hr<6?'Buenas noches.':hr<13?'Buen día.':hr<20?'Buenas tardes.':'Buenas noches.';
  const el=$('#greet'); if(el.textContent!==g) el.textContent=g;
}
tick(); setInterval(()=>{ if(!document.hidden) tick(); },1000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) tick(); });

/* ---------- Tarjetas de inicio ---------- */
const CAT={turnero:'Operaciones',asistencia:'Personal',encuestas:'Datos',certificados:'Documentos',ia:'Inteligencia artificial'};
function buildCards(){
  $('#bento').innerHTML = TOOLS.map((t,i)=>`
    <a class="card ${t.size}" data-cat="${CAT[t.id]||'Otras'}" href="#${t.id}" style="--t:${t.color};--i:${i+2}" data-id="${t.id}">
      <div class="art">${ART[t.id]}</div><button type="button" class="fav" data-fav="${t.id}" aria-pressed="${isFav(t.id)}" aria-label="Marcar ${t.short} como favorita"><svg class="i" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9 6.8 19.7l1-5.9L3.5 9.7l5.9-.8z"/></svg></button>
      <div class="cbody"><h3>${t.name}</h3><p>${t.desc}</p></div>
      <div class="cfoot"><span class="meta"><span class="chip">${CAT[t.id]||'Otras'}</span><span class="chip">${t.kind==='web'?'Web':'Interna'}</span><span class="chip st" data-st="${t.id}" data-s="wait"><i class="sd"></i><b>Verificando</b></span><kbd class="hk" aria-hidden="true">${i+1}</kbd></span><span class="open">Abrir ${ico('i-arrow')}</span></div>
    </a>`).join('');
}

/* ---------- Recientes ---------- */
function ago(ts){
  const s=Math.round((Date.now()-ts)/1000);
  if(s<60) return 'hace un momento';
  const rtf=new Intl.RelativeTimeFormat('es',{numeric:'auto'});
  if(s<3600) return rtf.format(-Math.round(s/60),'minute');
  if(s<86400) return rtf.format(-Math.round(s/3600),'hour');
  return rtf.format(-Math.round(s/86400),'day');
}
function pushRecent(id){
  let r=store.get('volksia_recent',[]).filter(x=>x.id!==id);
  r.unshift({id,t:Date.now()}); store.set('volksia_recent',r.slice(0,6));
}
function renderRecents(){
  const r=store.get('volksia_recent',[]).map(x=>({...x,tool:TOOLS.find(t=>t.id===x.id)})).filter(x=>x.tool).slice(0,3);
  $('#recents').hidden=!r.length;
  $('#rlist').innerHTML=r.map(x=>`<a class="rchip" href="#${x.id}" style="--t:${x.tool.color}"><span class="ri">${ico(x.tool.icon)}</span>${x.tool.short}<small>${ago(x.t)}</small></a>`).join('');
}

/* ---------- Visor ---------- */
function startLoad(pane,t,f){
  pane.classList.add('loading'); pane.classList.remove('slow');
  clearTimeout(pane._t); pane._t=setTimeout(()=>pane.classList.add('slow'),7000);
  f.src=t.src;
}
function ensurePane(t){
  if(panes[t.id]) return panes[t.id];
  const pane=document.createElement('div');
  pane.className='pane'; pane.dataset.id=t.id; pane.style.setProperty('--t',t.color);
  if(t.src && t.embed===false){
    pane.innerHTML=`<div class="empty"><div><div class="eico">${ico(t.icon)}</div><h3>${t.name}</h3><p>${t.launch}</p><p style="margin-top:22px"><button class="btn primary" type="button" data-open style="margin:0 auto">${ico('i-ext')}<span>Abrir ${t.short}</span></button></p></div></div>`;
    pane.querySelector('[data-open]').addEventListener('click',()=>openExternal(t));
    $('#frame').appendChild(pane); panes[t.id]=pane; return pane;
  }
  if(!t.src){
    pane.innerHTML=`<div class="empty"><div><div class="eico">${ico(t.icon)}</div><h3>Falta la dirección de ${t.short}</h3><p>Abrí el archivo <code>index.html</code>, buscá la línea <code>const AI_URL</code> y pegá ahí la URL de tu IA.</p></div></div>`;
  }else{
    pane.innerHTML=`<div class="pbar"></div><div class="loader"><div><div class="mascot-slot big">${mascot()}</div><div class="skel"><i></i><i></i><i></i></div><strong>Abriendo ${t.short}</strong><span>${t.slow||'Está tardando un poco más de lo normal. Si no aparece, usá Abrir aparte.'}</span></div></div>`;
    const f=document.createElement('iframe');
    f.title=t.name; f.allow='clipboard-read; clipboard-write; fullscreen';
    /* los sitios externos corren aislados; las herramientas propias necesitan acceso a su almacenamiento */
    if(t.kind==='web') f.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-modals');
    f.addEventListener('load',()=>{pane.classList.remove('loading','slow');clearTimeout(pane._t)});
    pane.appendChild(f);
    $('#frame').appendChild(pane);
    panes[t.id]=pane;
    /* si el archivo de una herramienta propia todavía no está publicado, avisamos en vez de mostrar una página 404 */
    if(t.kind==='local'){
      fetch(t.src,{method:'HEAD',cache:'no-store'}).then(r=>{
        if(r.ok) return;
        clearTimeout(pane._t);
        pane.innerHTML=`<div class="empty"><div><div class="eico">${ico(t.icon)}</div><h3>${t.name} todavía no está disponible</h3><p>No encontramos el archivo <code>${t.src}</code>. Verificá que esté subido a la carpeta <code>herramientas</code> del sitio.</p></div></div>`;
      }).catch(()=>{});
    }
    startLoad(pane,t,f);
    return pane;
  }
  $('#frame').appendChild(pane);
  panes[t.id]=pane; return pane;
}

function setFocus(on){
  app.classList.toggle('focus',on);
  const b=$('#btnFocus');
  b.innerHTML=`${ico(on?'i-shrink':'i-expand')}<span>${on?'Salir de pantalla completa':'Pantalla completa'}</span>`;
  b.title=on?'Volver a mostrar el menú':'Ocultar el menú para ganar espacio';
}

function setNav(id){
  document.querySelectorAll('.rl').forEach(a=>{
    if(a.dataset.id===id) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
}

function showTool(t){
  current=t;
  $('#home').hidden=true; $('#stage').hidden=false;
  Object.values(panes).forEach(p=>p.classList.remove('active'));
  ensurePane(t).classList.add('active');
  const st=$('#stage'); st.style.setProperty('--t',t.color);
  $('#stIcon').innerHTML=ico(t.icon);
  $('#stName').textContent=t.name;
  $('#stMeta').textContent=t.kind==='web'?'Sistema web':'Herramienta interna';
  $('#crumbs').innerHTML=`<a href="#inicio">Inicio</a>${ico('i-chev')}<span class="cur">${t.name}</span>`;
  setNav(t.id); setMenu(false);
  document.title=`${t.name} | SURI Tools Center`;
  pushRecent(t.id);
  /* lectores de pantalla: anunciar la herramienta que se abrió */
  $('#stName').focus({preventScroll:true});
}
function showHome(){
  renderFavs();
  current=null;
  setFocus(false);
  $('#stage').hidden=true; $('#home').hidden=false;
  $('#crumbs').innerHTML=`<span class="cur">Inicio</span>`;
  setNav('inicio'); setMenu(false);
  document.title='SURI Tools Center';
  renderRecents();
  $('#home').scrollTop=0;
  if(booted) $('#main').focus({preventScroll:true});
}
function route(){
  const id=decodeURIComponent(location.hash.slice(1));
  const t=TOOLS.find(x=>x.id===id);
  if(t) showTool(t); else showHome();
}
addEventListener('hashchange',route);

function reloadCurrent(){
  if(!current) return;
  if(!current.src){toast('Todavía no configuraste la URL de Mi IA en index.html');return}
  const pane=panes[current.id], f=pane&&pane.querySelector('iframe'); if(!f) return;
  pane.classList.add('loading');
  clearTimeout(pane._t); pane._t=setTimeout(()=>pane.classList.add('slow'),7000);
  try{f.contentWindow.location.reload()}catch(e){f.src=current.src}
}
function openExternal(t){
  if(!t.src){toast('Todavía no configuraste la URL de Mi IA en index.html');return}
  window.open(t.src,'_blank','noopener,noreferrer');
}
$('#btnReload').addEventListener('click',reloadCurrent);
$('#btnFocus').addEventListener('click',()=>setFocus(!app.classList.contains('focus')));
$('#btnExt').addEventListener('click',()=>current&&openExternal(current));

/* ---------- Buscador (Ctrl K) ---------- */
const pal=$('#palette'), palInput=$('#palInput'), palList=$('#palList');
let palSel=0, palShown=[];
const isMac=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
$('#palkey').textContent=$('#palkey2').textContent=isMac?'⌘ K':'Ctrl K';

function palItems(){
  const items=TOOLS.map(t=>({label:t.name,hint:t.kind==='web'?'Sistema web':'Herramienta interna',icon:t.icon,color:t.color,keys:t.keys,run:()=>{location.hash=t.id}}));
  items.unshift({label:'Ir al inicio',hint:'Panel principal',icon:'i-home',color:'#009FE3',keys:'home panel principal',run:()=>{location.hash='inicio'}});
  if(current){
    items.push({label:`Recargar ${current.short}`,hint:'Herramienta abierta',icon:'i-reload',color:'#009FE3',keys:'actualizar',run:reloadCurrent});
    items.push({label:`Abrir ${current.short} en una pestaña nueva`,hint:'Herramienta abierta',icon:'i-ext',color:'#009FE3',keys:'aparte externo',run:()=>openExternal(current)});
    items.push({label:app.classList.contains('focus')?'Salir de pantalla completa':'Pantalla completa',hint:'Herramienta abierta',icon:'i-expand',color:'#009FE3',keys:'ocultar menu',run:()=>setFocus(!app.classList.contains('focus'))});
  }
  const dark=document.documentElement.dataset.theme==='dark';
  items.push({label:dark?'Cambiar a tema claro':'Cambiar a tema oscuro',hint:'Apariencia',icon:dark?'i-sun':'i-moon',color:'#009FE3',keys:'modo noche dia apariencia',run:toggleTheme});
  return items;
}
function renderPal(){
  const q=norm(palInput.value.trim());
  palShown=palItems().filter(i=>!q||norm(i.label+' '+i.hint+' '+(i.keys||'')).includes(q));
  palSel=Math.min(palSel,Math.max(palShown.length-1,0));
  palList.innerHTML=palShown.length?palShown.map((i,n)=>`<li class="pli${n===palSel?' sel':''}" id="pal-${n}" role="option" aria-selected="${n===palSel}" data-n="${n}" style="--t:${i.color}"><span class="pi">${ico(i.icon)}</span><span><b>${i.label}</b><small>${i.hint}</small></span><span class="ent">${ico('i-enter')}</span></li>`).join(''):`<li class="palnone">No encontramos resultados. Probá con otra palabra.</li>`;
  const s=palList.querySelector('.sel'); if(s) s.scrollIntoView({block:'nearest'});
  palInput.setAttribute('aria-activedescendant', s ? s.id : '');
}
function openPal(){setMenu(false);palInput.value='';palSel=0;renderPal();if(!pal.open)pal.showModal();palInput.focus()}
function runPal(n){const it=palShown[n];if(!it)return;pal.close();it.run()}
palInput.addEventListener('input',()=>{palSel=0;renderPal()});
palInput.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palSel+1,palShown.length-1);renderPal()}
  else if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(palSel-1,0);renderPal()}
  else if(e.key==='Enter'){e.preventDefault();runPal(palSel)}
});
palList.addEventListener('click',e=>{const li=e.target.closest('.pli');if(li)runPal(+li.dataset.n)});
palList.addEventListener('mousemove',e=>{const li=e.target.closest('.pli');if(li&&+li.dataset.n!==palSel){palSel=+li.dataset.n;palList.querySelectorAll('.pli').forEach((x,n)=>{x.classList.toggle('sel',n===palSel);x.setAttribute('aria-selected',String(n===palSel))});palInput.setAttribute('aria-activedescendant','pal-'+palSel)}});
pal.addEventListener('click',e=>{if(e.target===pal)pal.close()});
$('#palbtn').addEventListener('click',openPal);

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='k'){e.preventDefault();pal.open?pal.close():openPal();return}
  if(k==='/'&&!pal.open&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();openPal();return}
  /* en el inicio, las teclas 1 a 9 abren la herramienta con ese número */
  if(!current&&!pal.open&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&/^[1-9]$/.test(e.key)&&!/input|textarea|select/i.test(document.activeElement.tagName)){
    const t=TOOLS[+e.key-1]; if(t){e.preventDefault();location.hash=t.id;return}
  }
  if(k==='escape'&&!pal.open){
    if(app.classList.contains('focus')) setFocus(false); else setMenu(false);
  }
});

/* ---------- Skill /bencho: Heat word (en el inicio) ---------- */
(function(){
/* ══ Heat word ════════════════════════════════════════════
   A big word in flat, dull grey — until the hand comes. Around
   the cursor the word turns into a heat map of its own shape:
   deep navy in the middle of every stroke, through blue, cyan,
   yellow, orange and red, to a pink rim. Right under the pointer
   the heat opens up and the strokes thin, like something melting;
   leave and it fades back to grey. Press it and the next shape
   melts in.

   ── A FIELD, THEN A PALETTE ─────────────────────────────
   The word is drawn once, blurred, into a grey field: bright in
   the thick of a stroke, fading at its edge. The cursor adds a
   soft round of heat to that field. Every pixel's brightness is
   then looked up in a 256-entry table of colours. Two strokes
   close together overlap in the field, so they fuse where the
   heat pools — that is the liquid, and nothing animates it but
   the field.

   ── THE BLUR IS A SHADOW ────────────────────────────────
   ctx.filter is not in every Safari, shadowBlur is. The word is
   drawn far off the canvas with its shadow thrown back on, so
   only the blurred shadow lands. */

/* (Port a JS sin React: este proyecto es HTML puro, así que el
   estado vive en variables y el lienzo se pinta directo.) */

/* más ancho que el original: "SURI" tiene siete letras y necesita aire para leerse */
const W = 380;
const H = 150;
/* one word, always: its curves and its straight stems both melt well */
const word = "SURI";

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* the word is the panel's own display face (Bricolage Grotesque, bold),
   so it is already on the page and never fetched twice */
const FACE = { family: "Bricolage Grotesque", weight: 700 };

/* ── or a shape, instead of a word ─────────────────────────
   The heat reads any shape, and the ones that look most liquid
   are where strokes meet or nearly touch: bars crossing at a
   centre, dots close enough to run together. Each takes a seed,
   so a press deals a new arrangement of the same kind. */
const SHAPES = ["Word", "Dots", "Asterisk"];

function rng(seed) {
  let t = seed * 9301 + 49297;
  return () => {
    t = (t * 9301 + 49297) % 233280;
    return t / 233280;
  };
}

/* a thick line through a list of points */
function line(g, pts) {
  g.beginPath();
  pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
  g.stroke();
}

/* where the hand is, in the field's pixels, and how present it is:
   { x, y, on, area } */
function drawShape(g, shape, w, h, r, seed, hand) {
  const rand = rng(seed);
  const cx = w / 2, cy = h / 2;
  g.lineCap = "round";
  g.lineJoin = "round";
  if (shape === "Dots") {
    /* a loose grid, near enough that neighbours run together. The
       dots under the hand swell, on a gaussian, so the ones nearest
       grow into each other and fuse while the far ones keep their
       size — and the rand() calls stay in the same order, so the
       arrangement never shifts while they do */
    const cols = 7, rows = 3;
    const reach = 62 * r * (hand ? hand.area : 1);
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const x = cx + (i - (cols - 1) / 2) * 38 * r + (rand() - 0.5) * 8 * r;
        const y = cy + (j - (rows - 1) / 2) * 38 * r + (rand() - 0.5) * 8 * r;
        let rad = (9 + rand() * 7) * r;
        if (hand && hand.on > 0.002) {
          const d2 = ((x - hand.x) ** 2 + (y - hand.y) ** 2) / (reach * reach);
          rad *= 1 + 0.75 * hand.on * Math.exp(-d2);
        }
        g.beginPath();
        g.arc(x, y, rad, 0, Math.PI * 2);
        g.fill();
      }
    }
  } else if (shape === "Asterisk") {
    /* fat bars crossing, every one of them through the centre */
    g.lineWidth = 16 * r;
    const n = 3 + Math.floor(rand() * 2), turn = rand() * Math.PI;
    for (let i = 0; i < n; i++) {
      const a = turn + (i / n) * Math.PI;
      const c = Math.cos(a) * 66 * r, sn = Math.sin(a) * 66 * r;
      line(g, [[cx - c, cy - sn], [cx + c, cy + sn]]);
    }
  }
}

/* the face is on the page already, but may not have arrived by
   the first frame — waited for, or the first word is the fallback.
   Never waited for long: after a second and a half it is drawn
   in the fallback, which is still a word. */
async function ensure() {
  try {
    await Promise.race([
      document.fonts && document.fonts.load(`${FACE.weight} 100px "${FACE.family}"`),
      new Promise((r) => setTimeout(r, 1500)),
    ]);
  } catch (e) {
    /* drawn in the fallback, which is still a word */
  }
}

/* the palettes, rim (0) to core (1); below the floor it is the card.
   Neon is the heat camera: a pink rim through red, yellow and
   cyan to a navy core. The others keep its shape — a light rim, a
   dark core, a bright band between — in other colours. */
const PALETTES = {
  Neon: [
    [0.0, [255, 150, 225]],
    [0.1, [255, 90, 190]],
    [0.2, [255, 50, 60]],
    [0.32, [255, 150, 40]],
    [0.42, [255, 228, 100]],
    [0.54, [120, 215, 255]],
    [0.68, [40, 120, 245]],
    [0.84, [12, 44, 150]],
    [1.0, [6, 18, 80]],
  ],
  Fire: [
    [0.0, [255, 238, 180]],
    [0.16, [255, 200, 80]],
    [0.34, [255, 130, 30]],
    [0.52, [228, 58, 28]],
    [0.72, [150, 18, 44]],
    [0.88, [74, 6, 42]],
    [1.0, [30, 2, 24]],
  ],
  Sea: [
    [0.0, [210, 255, 225]],
    [0.16, [110, 245, 175]],
    [0.34, [40, 215, 200]],
    [0.52, [40, 150, 235]],
    [0.72, [80, 70, 205]],
    [0.88, [60, 20, 130]],
    [1.0, [24, 8, 60]],
  ],
  Pop: [
    [0.0, [255, 225, 240]],
    [0.16, [255, 160, 210]],
    [0.34, [245, 110, 190]],
    [0.52, [180, 110, 255]],
    [0.72, [100, 150, 255]],
    [0.88, [40, 70, 190]],
    [1.0, [20, 24, 100]],
  ],
};
const FLOOR = 34;

function table(STOPS) {
  const t = new Uint8ClampedArray(256 * 4);
  for (let i = 0; i < 256; i++) {
    if (i < FLOOR) {
      /* under the floor: nothing, so the card shows through */
      t[i * 4 + 3] = 0;
      continue;
    }
    const u = (i - FLOOR) / (255 - FLOOR);
    let k = 0;
    while (k < STOPS.length - 2 && u > STOPS[k + 1][0]) k++;
    const [u0, c0] = STOPS[k];
    const [u1, c1] = STOPS[k + 1];
    const f = clamp((u - u0) / (u1 - u0), 0, 1);
    for (let c = 0; c < 3; c++) t[i * 4 + c] = c0[c] + (c1[c] - c0[c]) * f;
    /* the rim fades in over the first stretch, so the pink is a
       glow at the edge rather than a hard line */
    t[i * 4 + 3] = 255 * clamp((i - FLOOR) / 26, 0, 1);
  }
  return t;
}
/* one table per palette, made the first time it is asked for */
const LUTS = new Map();
function lut(name) {
  let t = LUTS.get(name);
  if (!t) {
    t = table(PALETTES[name] || PALETTES.Neon);
    LUTS.set(name, t);
  }
  return t;
}

/* ── and at rest, just grey ────────────────────────────────
   The word sits on the card as a flat, dull grey — solid where
   the heat would be, soft at the edge — and the heat map is only
   ever shown where the hand is. GREY_A is the grey's alpha per
   brightness: the letter's body at full, a short soft edge. */
const GREY = [150, 150, 154];
const GREY_A = new Uint8ClampedArray(256);
for (let i = 0; i < 256; i++) GREY_A[i] = 255 * clamp((i - 70) / 45, 0, 1);

const el = document.getElementById("heat");
const shown = document.getElementById("heatCv");
if (!el || !shown) return;

/* how much heat the cursor brings, how soft the letters are, how big the
   patch under the hand is (each 0..100), and which heat map it reveals */
const knobs = { heat: 60, soft: 18, area: 50, colors: "Neon" };
let seed = Math.floor(Math.random() * 1000);
let shape = "Word";
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const st = {
  base: null, work: null,
  px: 0.5, py: 0.5, tx: 0.5, ty: 0.5,
  power: 0, want: 0,
  grow: 0,
  raf: 0,
  ratio: 1,
  /* the dots were last drawn swollen, and owe one redraw at rest */
  swollen: false,
};
/* Area as a multiplier on every radius the hand has: half at 0,
   as it was at 50, half again at 100 */
const spread = () => 0.5 + clamp(knobs.area, 0, 100) / 100;

/* the word, blurred, into the base field — redrawn when the
   word or the softness changes */
function build() {
  const s = st;
  const r = Math.min(2, window.devicePixelRatio || 1);
  s.ratio = r;
  const w = Math.round(W * r), h = Math.round(H * r);
  const base = s.base || document.createElement("canvas");
  base.width = w; base.height = h;
  s.base = base;
  if (!s.work) s.work = document.createElement("canvas");
  s.work.width = w; s.work.height = h;
  shown.width = w; shown.height = h;
  field();
}

/* the field itself, into the base at its current size — once per
   build for a word, and every frame the hand moves for the dots,
   which change size under it */
function field() {
  const s = st;
  const base = s.base;
  const r = s.ratio;
  const w = base.width, h = base.height;
  const g = base.getContext("2d");
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.shadowColor = "transparent";
  g.fillStyle = "#000";
  g.fillRect(0, 0, w, h);
  const blur = (6 + (clamp(knobs.soft, 0, 100) / 100) * 16) * r;
  const off = w * 3;
  g.shadowColor = "#fff";
  g.shadowBlur = blur;
  g.shadowOffsetX = off;
  g.fillStyle = "#fff";
  g.strokeStyle = "#fff";
  if (shape !== "Word") {
    /* drawn off the canvas so only the blurred shadow lands */
    g.save();
    g.translate(-off, 0);
    const hand = { x: s.px * w, y: s.py * h, on: s.power, area: spread() };
    drawShape(g, shape, w, h, r, seed, hand);
    drawShape(g, shape, w, h, r, seed, hand);
    g.restore();
    return;
  }
  /* as large as fits */
  let size = 150 * r;
  const f = `"${FACE.family}", system-ui, sans-serif`;
  g.font = `${FACE.weight} ${size}px ${f}`;
  const fit = (w * 0.88) / g.measureText(word).width;
  size = Math.min(size, size * fit);
  g.font = `${FACE.weight} ${size}px ${f}`;
  g.textAlign = "center";
  g.textBaseline = "middle";
  /* twice over, so the thick of a stroke saturates */
  g.fillText(word, w / 2 - off, h / 2 + size * 0.04);
  g.fillText(word, w / 2 - off, h / 2 + size * 0.04);
}

/* one frame: base, plus heat at the cursor, through the palette */
function paint() {
  const s = st;
  const c = shown;
  if (!s.base || !s.work) return;
  const w = c.width, h = c.height;
  /* the dots follow the hand, so their field is redrawn with it */
  if (shape === "Dots" && (s.power > 0.002 || s.swollen)) {
    field();
    s.swollen = s.power > 0.002;
  }
  const g = s.work.getContext("2d", { willReadFrequently: true });
  g.globalCompositeOperation = "source-over";
  g.globalAlpha = 1;
  g.fillStyle = "#000";
  g.fillRect(0, 0, w, h);
  /* the shape grows in from nothing when it changes */
  g.globalAlpha = s.grow;
  g.drawImage(s.base, 0, 0);
  g.globalAlpha = 1;
  if (s.power > 0.002) {
    const cx = s.px * w, cy = s.py * h;
    const rad = (60 + (knobs.heat / 100) * 50) * s.ratio * spread();
    const amt = s.power * (0.35 + (knobs.heat / 100) * 0.55);
    /* the cursor COOLS the field: a multiply that dims it toward
       the middle of the pointer, so the navy cores open up into
       rings of blue, cyan, yellow and red and the strokes thin
       there — the letters melting under the hand */
    g.globalCompositeOperation = "multiply";
    const cool = g.createRadialGradient(cx, cy, 0, cx, cy, rad);
    const v = (k) => Math.round(255 * (1 - amt * k));
    cool.addColorStop(0, `rgb(${v(1)},${v(1)},${v(1)})`);
    cool.addColorStop(0.45, `rgb(${v(0.6)},${v(0.6)},${v(0.6)})`);
    cool.addColorStop(1, "rgb(255,255,255)");
    g.fillStyle = cool;
    g.fillRect(0, 0, w, h);
  }
  const src = g.getImageData(0, 0, w, h).data;
  const LUT = lut(knobs.colors);
  const out = c.getContext("2d").createImageData(w, h);
  const d = out.data;
  /* the reveal: how much heat map each pixel shows, a soft disc
     around the cursor scaled by how present the hand is. Outside
     it the word is grey. */
  const cx = s.px * w, cy = s.py * h;
  const R = (95 + (knobs.heat / 100) * 55) * s.ratio * spread();
  const R2 = R * R;
  const on = s.power;
  for (let y = 0, i = 0; y < h; y++) {
    const dy2 = (y - cy) * (y - cy);
    for (let x = 0; x < w; x++, i += 4) {
      const f = src[i];
      const v = f * 4;
      let m = 0;
      if (on > 0.002) {
        const q = ((x - cx) * (x - cx) + dy2) / R2;
        if (q < 1) {
          const t = 1 - q;
          m = on * t * t * (3 - 2 * t);
        }
      }
      const ga = GREY_A[f];
      if (m <= 0) {
        d[i] = GREY[0]; d[i + 1] = GREY[1]; d[i + 2] = GREY[2]; d[i + 3] = ga;
        continue;
      }
      const k = 1 - m;
      d[i] = GREY[0] * k + LUT[v] * m;
      d[i + 1] = GREY[1] * k + LUT[v + 1] * m;
      d[i + 2] = GREY[2] * k + LUT[v + 2] * m;
      d[i + 3] = ga * k + LUT[v + 3] * m;
    }
  }
  c.getContext("2d").putImageData(out, 0, 0);
}

/* the loop runs only while something is moving */
function run() {
  const s = st;
  if (s.raf) return;
  let prev = performance.now();
  const step = (t) => {
    const dt = Math.min(0.05, (t - prev) / 1000);
    prev = t;
    const k = 1 - Math.pow(0.002, dt);
    s.px += (s.tx - s.px) * k;
    s.py += (s.ty - s.py) * k;
    s.power += (s.want - s.power) * (1 - Math.pow(0.01, dt));
    s.grow = Math.min(1, s.grow + dt / 0.9);
    paint();
    const still = s.grow >= 1 && Math.abs(s.want - s.power) < 0.004 && Math.abs(s.tx - s.px) < 0.001 && Math.abs(s.ty - s.py) < 0.001;
    if (still && s.want === 0) s.power = 0;
    s.raf = still ? 0 : requestAnimationFrame(step);
    if (still) paint();
  };
  s.raf = requestAnimationFrame(step);
}

function go() {
  cancelAnimationFrame(st.raf); st.raf = 0;
  build();
  st.grow = reduced ? 1 : 0;
  run();
}
/* the face first, or the first word is drawn in the fallback */
ensure().then(go);

function aim(e) {
  const r = el.getBoundingClientRect();
  st.tx = (e.clientX - r.left) / r.width;
  st.ty = (e.clientY - r.top) / r.height;
}
function next() {
  /* the next shape round, the dots and the asterisk dealt a
     fresh arrangement as they come back */
  const i = SHAPES.indexOf(shape);
  seed += 1;
  shape = SHAPES[(i + 1) % SHAPES.length];
  el.setAttribute("aria-label", shape === "Word" ? `${word}. Tocá para cambiar de forma` : `${shape === "Dots" ? "Puntos" : "Asterisco"}. Tocá para cambiar de forma`);
  ensure().then(go);
}
el.addEventListener("pointerenter", (e) => { aim(e); st.px = st.tx; st.py = st.ty; st.want = 1; run(); });
el.addEventListener("pointermove", (e) => { aim(e); st.want = 1; run(); });
el.addEventListener("pointerleave", () => { st.want = 0; run(); });
el.addEventListener("click", next);
el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); next(); } });
})();

/* ---------- Mascota: te sigue con la mirada ---------- */
/* Un robotito propio de SURI. Tiene cuerpo azul marino, antena celeste
   (el mismo puntito del logo anterior), ojos que siguen el cursor,
   parpadea cada tanto y pega un saltito si lo tocás. */
function mascot(){
  return `<svg class="mascot" viewBox="0 0 64 64" role="img" aria-label="SURI">
    <g class="m-hop">
      <rect x="18" y="52" width="10" height="7" rx="3.5" fill="#0B3C86"/>
      <rect x="36" y="52" width="10" height="7" rx="3.5" fill="#0B3C86"/>
      <g class="m-head" transform="rotate(0 32 54)">
        <g class="m-ant"><path d="M32 14V9" stroke="#00A8F0" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="7" r="4.2" fill="#00A8F0"/></g>
        <rect x="8" y="14" width="48" height="40" rx="15" fill="#001E50" stroke="rgba(124,196,255,.38)" stroke-width="1.5"/>
        <g class="m-eye"><circle cx="23.5" cy="31" r="8.5" fill="#fff"/><g class="m-pupil"><circle cx="23.5" cy="31" r="4.2" fill="#0A1A2F"/><circle cx="25" cy="29.5" r="1.3" fill="#fff"/></g></g>
        <g class="m-eye"><circle cx="40.5" cy="31" r="8.5" fill="#fff"/><g class="m-pupil"><circle cx="40.5" cy="31" r="4.2" fill="#0A1A2F"/><circle cx="42" cy="29.5" r="1.3" fill="#fff"/></g></g>
        <path d="M26 46q6 5 12 0" fill="none" stroke="#00A8F0" stroke-width="2.6" stroke-linecap="round"/>
      </g>
    </g>
  </svg>`;
}
document.querySelectorAll('[data-mascot]').forEach(n=>{n.innerHTML=mascot()});

let mx=null,my=null,mraf=0;
function lookAt(){
  mraf=0;
  document.querySelectorAll('.mascot').forEach(svg=>{
    const r=svg.getBoundingClientRect(); if(!r.width) return;
    let px=0,py=0,tilt=0;
    if(mx!==null){
      const dx=mx-(r.left+r.width/2), dy=my-(r.top+r.height*.5), dist=Math.hypot(dx,dy)||1;
      /* cerca del muñeco mira de frente al cursor; lejos, llega al borde del ojo */
      const k=Math.min(1,dist/140), max=3.6;
      px=dx/dist*max*k; py=dy/dist*max*k;
      tilt=Math.max(-8,Math.min(8,dx/60));
    }
    svg.querySelectorAll('.m-pupil').forEach(p=>p.setAttribute('transform',`translate(${px.toFixed(2)} ${py.toFixed(2)})`));
    svg.querySelector('.m-head').setAttribute('transform',`rotate(${tilt.toFixed(1)} 32 54)`);
  });
}
const lookSoon=()=>{ if(!mraf) mraf=requestAnimationFrame(lookAt); };
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;lookSoon()},{passive:true});
addEventListener('pointerdown',e=>{mx=e.clientX;my=e.clientY;lookSoon()},{passive:true});
/* si el cursor sale de la ventana, vuelve a mirar al frente */
document.addEventListener('mouseleave',()=>{mx=null;lookSoon()});
/* saltito al tocar el logo */
$('.brand').addEventListener('click',()=>{
  const m=$('.brand .mascot'); if(!m) return;
  m.classList.remove('hop'); void m.getBoundingClientRect(); m.classList.add('hop');
  setTimeout(()=>m.classList.remove('hop'),650);
});


/* ---------- SURI: favoritos, estado real y configuración ---------- */
function isFav(id){return store.get('suri_favs',[]).includes(id)}
function toggleFav(id){
  let f=store.get('suri_favs',[]); f=f.includes(id)?f.filter(x=>x!==id):[id,...f]; store.set('suri_favs',f);
  document.querySelectorAll(`[data-fav="${id}"]`).forEach(b=>b.setAttribute('aria-pressed',String(f.includes(id))));
  renderFavs(); updKpis();
}
function renderFavs(){
  const r=store.get('suri_favs',[]).map(id=>TOOLS.find(t=>t.id===id)).filter(Boolean);
  $('#favs').hidden=!r.length;
  $('#flist').innerHTML=r.map(t=>`<a class="rchip" href="#${t.id}" style="--t:${t.color}"><span class="ri">${ico(t.icon)}</span>${t.short}</a>`).join('');
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-fav]'); if(!b) return; e.preventDefault(); e.stopPropagation(); toggleFav(b.dataset.fav)},true);

function setStatus(id,s,txt,tip){
  const el=document.querySelector(`[data-st="${id}"]`); if(!el) return;
  el.dataset.s=s; el.querySelector('b').textContent=txt; el.title=tip||''; updKpis();
}
async function checkTool(t){
  if(location.protocol==='file:'){setStatus(t.id,'wait','No verificado','Abrí el sitio desde GitHub Pages o un servidor para verificar');return}
  const ac=new AbortController(), to=setTimeout(()=>ac.abort(),9000);
  try{
    if(t.kind==='local'){
      const r=await fetch(t.src,{method:'HEAD',cache:'no-store',signal:ac.signal});
      r.ok?setStatus(t.id,'ok','Disponible','El archivo existe en el sitio'):setStatus(t.id,'bad','No encontrado','Falta el archivo '+t.src);
    }else{
      await fetch(t.src,{mode:'no-cors',cache:'no-store',signal:ac.signal});
      setStatus(t.id,'ok','Responde','El servidor respondió. No se puede comprobar su contenido desde acá.');
    }
  }catch(e){setStatus(t.id,'bad','Sin respuesta','No se pudo contactar el destino. Probá abrirlo aparte.')}
  finally{clearTimeout(to)}
}
function checkAll(){TOOLS.forEach(checkTool)}

$('#cats').addEventListener('click',e=>{
  const b=e.target.closest('[data-c]'); if(!b) return;
  document.querySelectorAll('#cats button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  document.querySelectorAll('#bento .card').forEach(c=>{c.hidden=!(b.dataset.c==='Todas'||c.dataset.cat===b.dataset.c)});
});
$('#bento').addEventListener('pointermove',e=>{const c=e.target.closest('.card'); if(!c) return; const r=c.getBoundingClientRect(); c.style.setProperty('--mx',(e.clientX-r.left)+'px'); c.style.setProperty('--my',(e.clientY-r.top)+'px')});
/* ---------- Inicio ---------- */
let booted=false;
buildNav(); buildCards(); renderFavs(); buildCats(); updKpis(); route(); booted=true; checkAll();
setTimeout(()=>app.classList.remove('intro'),1400);
</script>
